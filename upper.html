* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #eef2f7;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;

/* A4 REPORT PAGE WITH EXACT ROYAL BLUE FRAME */
.report-page {
    width: 210mm;
    height: 297mm;
    background: white;
    margin: 20px auto;
    padding: 10mm 12mm 8mm 12mm;
    position: relative;
    overflow: hidden;
    border: 10mm solid #0a388a; 
}

/* BACKGROUND WATERMARK */
.watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 0;
}

.content-wrapper {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Keeps footer strictly at the bottom without pushing content off-page */
}

/* HEADER SECTION */
.header-section {
    text-align: center;
    margin-bottom: 4px;
}

.header-logo {
    max-width: 140px;
    height: auto;
    margin: 0 auto 4px auto;
    display: block;
}

.header-title {
    font-size: 14px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.header-divider {
    border: none;
    border-top: 2px solid #000;
    margin: 0 0 6px 0;
}

/* STUDENT INFO SECTION */
.student-info-grid {
    margin-bottom: 6px;
    font-size: 11px;
}

.info-row-main {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    margin-bottom: 2px;
}

.info-row-sub {
    text-align: center;
    font-weight: 800;
    font-size: 10px;
}

/* DESCRIPTION SECTION */
.description-block {
    font-size: 10px;
    line-height: 1.25;
    margin-bottom: 6px;
}

.description-block p {
    margin: 0 0 3px 0;
}

.bullet-list {
    list-style-type: none;
    padding-left: 12px;
    margin: 0;
}

.bullet-list li {
    position: relative;
    margin-bottom: 2px;
}

.bullet-list li::before {
    content: "■";
    font-size: 7px;
    position: absolute;
    left: -12px;
    top: 0px;
}

/* PROGRAMS COVERED */
.programs-section {
    margin-bottom: 6px;
    font-size: 10px;
}

.section-label {
    font-weight: 800;
    font-size: 10.5px;
    margin-bottom: 3px;
    text-transform: uppercase;
}

/* TABLES */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    margin-bottom: 6px;
}

th, td {
    border: 1px solid #333;
    padding: 2.5px 6px;
    text-align: left;
}

th {
    font-weight: 800;
    text-transform: uppercase;
    background: transparent;
}

td.center, th.center {
    text-align: center;
}

.total-row td {
    font-weight: 800;
}

/* FOOTER */
.footer-section {
    text-align: center;
    font-size: 9.5px;
    line-height: 1.2;
    padding-top: 4px;
}

.footer-motto {
    font-style: italic;
    font-weight: bold;
    color: #0a388a;
    margin-bottom: 2px;
}

.footer-divider {
    border: none;
    border-top: 1.5px solid #000000;
    width: 100%;
    margin: 0 auto 3px auto;
}

.footer-links {
    font-weight: normal;
    color: #0a388a;
}

@media print {
    @page {
        size: A4 portrait;
        margin: 0mm;

/* HELPER FUNCTIONS */
function show(value) {
    if (value === "" || value === null || value === undefined) {
        return "—";
    }
    return value;
}

const initialCounts = {};

function generateStudentID(fullName) {
    const parts = fullName.trim().split(/\s+/);
    let initials = "";

    if (parts.length >= 2) {
        initials = (parts[0][0] + parts[1][0]).toUpperCase();
    } else if (parts.length === 1 && parts[0].length > 0) {
        initials = parts[0].substring(0, 2).toUpperCase();
    } else {
        initials = "XX";
    }

    if (!initialCounts[initials]) {
        initialCounts[initials] = 1;
    } else {
        initialCounts[initials] += 1;
    }

    return `${initials} ${initialCounts[initials]}`;
}
