/* A4 REPORT PAGE WITH EXACT THICK ROYAL BLUE FRAME */
.report-page {

/* BACKGROUND WATERMARK */
.watermark {

    left: 50%;
    transform: translate(-50%, -50%);
    width: 65%;
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
}

.content-wrapper {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* HEADER SECTION */
.header-section {
    text-align: center;
    margin-bottom: 15px;
}

.header-logo {
    max-width: 180px;
    height: auto;
    margin: 0 auto 10px auto;
    display: block;
}

.header-title {
    font-size: 16px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.header-divider {

}

/* STUDENT INFO SECTION */
.student-info-grid {

.info-row-main {

.info-row-sub {

    font-weight: 800;
    font-size: 11px;
}

/* DESCRIPTION SECTION */
.description-block {
    font-size: 12px;
    line-height: 1.45;
    margin-bottom: 15px;
}

.description-block p {
    margin: 0 0 8px 0;
}

.bullet-list {
    list-style-type: none;
    padding-left: 15px;
    margin: 0;
}

.bullet-list li {
    position: relative;
    margin-bottom: 3px;
}

.bullet-list li::before {
    content: "■";
    font-size: 10px;
    position: absolute;
    left: -15px;
    top: 0px;
}

/* PROGRAMS COVERED */

    font-size: 12px;
}

.section-label {

    margin-bottom: 6px;
    text-transform: uppercase;

.programs-list {
    padding-left: 20px;
    margin: 0;
    line-height: 1.4;

/* TABLES */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 15px;
}

th, td {
    border: 1.5px solid #333;
    padding: 6px 12px;
    text-align: left;

th {

    text-transform: uppercase;

td.center, th.center {

/* FOOTER */

/* HELPER FUNCTIONS */
function show(value) {
    if (value === "" || value === null || value === undefined) {
        return "—";
    }
    return value;
}

/* ID GENERATOR BASED ON INITIALS & OCCURRENCE COUNTER */
const initialCounts = {};

function generateStudentID(fullName) {
    const parts = fullName.trim().split(/\s+/);
    let initials = "";

    if (parts.length >= 2) {
        initials = (parts[0][0] + parts[1][0]).toUpperCase();
    } else if (parts.length === 1 && parts[0].length > 0) {
        initials = parts[0].substring(0, 2).toUpperCase();
    } else {
        initials = "XX";
    }

    if (!initialCounts[initials]) {
        initialCounts[initials] = 1;
    } else {
        initialCounts[initials] += 1;
    }

    return `${initials} ${initialCounts[initials]}`;
}

/* GENERATE PDF FUNCTION */
async function generatePDF() {
    const controls = document.querySelector(".controls");
    const status = document.getElementById("status");
    const button = document.querySelector("button");

    button.disabled = true;
    button.innerText = "GENERATING PDF...";
    status.innerText = "Please wait. Creating student reports...";

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
        compress: true
    });

    const pages = document.querySelectorAll(".report-page");

    for (let i = 0; i < pages.length; i++) {
        status.innerText = `Creating report ${i + 1} of ${pages.length}...`;

        const canvas = await html2canvas(pages[i], {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff",
            logging: false
        });

        const imageData = canvas.toDataURL("image/jpeg", 0.95);

        if (i > 0) {
            pdf.addPage();
        }

        pdf.addImage(imageData, "JPEG", 0, 0, 210, 297);
    }

    pdf.save("Gumption_Excell_Coding_Robotics_Reports.pdf");

    button.disabled = false;
    button.innerText = "GENERATE COMPLETE PDF";
    status.innerText = "PDF generated successfully!";
}
